[project]
name = "api-ingest-builder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "jinja2>=3.1,<4", "rank-bm25>=0.2,<1", "selectolax>=0.3,<1", "markdownify>=1,<2", "sqlglot>=26,<40"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
verify = ["duckdb>=1,<2"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
